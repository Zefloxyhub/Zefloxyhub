<title id="t">Engineering domains</title>
<desc id="d">Four domains backed by repositories. FRONTEND: React / Next.js UIs, TypeScript · Vite, Motion &amp; interactions, Dashboards &amp; charts. BACKEND &amp; APIs: REST API (Express), Flask web app, JWT authentication, Data models &amp; routes. COMMERCE: Checkout flow, Stripe payments, Installment plans, Orders &amp; inventory. REAL-TIME &amp; DATA: Socket.io live chat, MongoDB / Mongoose, SQLite / SQLAlchemy, QR-code generation.</desc>
