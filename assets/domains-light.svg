<svg xmlns="http://www.w3.org/2000/svg" width="640" height="516" viewBox="0 0 640 516" role="img" aria-labelledby="t d">
<title id="t">Engineering domains</title>
<desc id="d">Four domains backed by repositories. FRONTEND: Next.js / React interfaces, Tailwind CSS design, Dashboards &amp; charts, PWA / offline page (built in Vantia · Loyalwise). BACKEND &amp; APIs: REST API with Express, Flask web app, JWT authentication, Data models &amp; routes (built in Vantia · Loyalwise). COMMERCE &amp; PAYMENTS: Checkout flow, Stripe payments, Installment plans, Orders &amp; inventory admin (built in Vantia). REAL-TIME &amp; DATA: Socket.io live chat, MongoDB / Mongoose, SQLite / SQLAlchemy, QR-code generation (built in Vantia · Loyalwise).</desc>
