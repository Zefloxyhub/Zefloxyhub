<title id="t">Featured projects</title>
<desc id="d">divine (latest): Tradifier studio website. Interactive site with an animated hero, a built-in terminal and a switch that shows every section as the data behind it. Languages: TypeScript 67.1%, CSS 32.3%, HTML 0.6%. Stack: React, TypeScript, Vite, Framer Motion, Netlify. loyalwise (early mvp): QR-code loyalty cards for small businesses. A shop fills in a short form and gets a digital loyalty card with its own QR code and a shareable card page. Languages: HTML 89.5%, Python 10.5%. Stack: Flask, SQLAlchemy, SQLite, qrcode, Gunicorn.</desc>
